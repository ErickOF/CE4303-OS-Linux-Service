name: Client builds

on:
  push:
    paths:
      - "clients/app/**"
      - "clients/web-page/**"
      - ".github/workflows/client-builds.yml"
  pull_request:
    paths:
      - "clients/app/**"
      - "clients/web-page/**"
      - ".github/workflows/client-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: Ionic app
            directory: clients/app
          - client: Web page
            directory: clients/web-page

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ matrix.directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.directory }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.directory }}
